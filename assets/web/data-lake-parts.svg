<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
<rect width="1280" height="840" fill="#ffffff"/>
<defs><marker id="m" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#52606d"/></marker></defs>
<text x="40" y="44" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#1f2933" text-anchor="start">データレイクの部品と、データの在処</text>
<text x="40" y="72" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="normal" fill="#52606d" text-anchor="start">左は処理の流れ、右は部品ごとにデータがどこにあるか。</text>
<rect x="40" y="100" width="560" height="700" rx="14" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.4"/>
<text x="64" y="134" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#334e68" text-anchor="start">流れ</text>
<rect x="170" y="140" width="300" height="70" rx="10" fill="#fdf6ee" stroke="#c9a227" stroke-width="1.6"/>
<text x="320.0" y="171.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Kinesis / Firehose</text>
<text x="320.0" y="195.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">流れてくるデータを S3 へ運ぶ</text>
<rect x="170" y="250" width="300" height="80" rx="10" fill="#eef4fa" stroke="#7aa7c7" stroke-width="1.6"/>
<text x="320.0" y="286.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">S3（データレイク）</text>
<text x="320.0" y="310.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">生データをそのまま置く</text>
<rect x="170" y="370" width="300" height="80" rx="10" fill="#f2f7f2" stroke="#7fae7f" stroke-width="1.6"/>
<text x="320.0" y="406.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Glue Data Catalog</text>
<text x="320.0" y="430.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">テーブル定義の台帳</text>
<rect x="170" y="490" width="300" height="90" rx="10" fill="#eef4fa" stroke="#7aa7c7" stroke-width="1.6"/>
<text x="320.0" y="531.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">Athena / Redshift / EMR</text>
<text x="320.0" y="555.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">台帳を引いて問い合わせる</text>
<rect x="170" y="620" width="300" height="70" rx="10" fill="#f2f7f2" stroke="#7fae7f" stroke-width="1.6"/>
<text x="320.0" y="651.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="17" font-weight="600" fill="#1f2933" text-anchor="middle">AWS Quick Sight</text>
<text x="320.0" y="675.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">集計結果を見せる</text>
<line x1="320.0" y1="216" x2="320.0" y2="242" stroke="#52606d" stroke-width="1.6" marker-end="url(#m)"/>
<text x="330.0" y="233.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">配送</text>
<line x1="320.0" y1="336" x2="320.0" y2="362" stroke="#52606d" stroke-width="1.6" marker-end="url(#m)"/>
<text x="330.0" y="353.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">クロールで登録</text>
<line x1="320.0" y1="456" x2="320.0" y2="482" stroke="#52606d" stroke-width="1.6" marker-end="url(#m)"/>
<text x="330.0" y="473.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">台帳を引く</text>
<line x1="320.0" y1="586" x2="320.0" y2="612" stroke="#52606d" stroke-width="1.6" marker-end="url(#m)"/>
<text x="330.0" y="603.0" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">結果</text>
<text x="64" y="742" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">Lake Formation が、台帳の列・行・セルに権限をかける。</text>
<text x="64" y="764" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">Athena / Spectrum / EMR は S3 を直接読み、Redshift は自前の DWH に持つ。</text>
<text x="64" y="786" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#52606d" text-anchor="start">Kinesis と MSK は、データをそれぞれのサービスの中に保持する。</text>
<rect x="632" y="100" width="608" height="700" rx="14" fill="#ffffff" stroke="#d9e2ec" stroke-width="1.4"/>
<text x="656" y="134" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#334e68" text-anchor="start">データの在処</text>
<rect x="656" y="170" width="560" height="56" rx="8" fill="#eef4fa" stroke="#d9e2ec"/>
<text x="672" y="194" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">S3</text>
<text x="672" y="214" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">置き場</text>
<text x="1200" y="202" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">S3 の中</text>
<rect x="656" y="232" width="560" height="56" rx="8" fill="#f2f7f2" stroke="#d9e2ec"/>
<text x="672" y="256" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Glue Data Catalog</text>
<text x="672" y="276" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">台帳（メタデータ）</text>
<text x="1200" y="264" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">台帳の中</text>
<rect x="656" y="294" width="560" height="56" rx="8" fill="#f7f4fa" stroke="#d9e2ec"/>
<text x="672" y="318" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Lake Formation</text>
<text x="672" y="338" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">権限</text>
<text x="1200" y="326" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">権限設定</text>
<rect x="656" y="356" width="560" height="56" rx="8" fill="#eef4fa" stroke="#d9e2ec"/>
<text x="672" y="380" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Redshift</text>
<text x="672" y="400" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">集計（DWH）</text>
<text x="1200" y="388" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">Redshift の中</text>
<rect x="656" y="418" width="560" height="56" rx="8" fill="#eef4fa" stroke="#d9e2ec"/>
<text x="672" y="442" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Redshift Spectrum</text>
<text x="672" y="462" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">S3 を直接問い合わせる</text>
<text x="1200" y="450" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">S3 の中</text>
<rect x="656" y="480" width="560" height="56" rx="8" fill="#fdf6ee" stroke="#d9e2ec"/>
<text x="672" y="504" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Kinesis Data Streams</text>
<text x="672" y="524" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">ストリーム</text>
<text x="1200" y="512" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">ストリームの中</text>
<rect x="656" y="542" width="560" height="56" rx="8" fill="#fdf6ee" stroke="#d9e2ec"/>
<text x="672" y="566" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Data Firehose</text>
<text x="672" y="586" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">配送</text>
<text x="1200" y="574" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">配送先による</text>
<rect x="656" y="604" width="560" height="56" rx="8" fill="#f2f7f2" stroke="#d9e2ec"/>
<text x="672" y="628" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">Iceberg テーブル</text>
<text x="672" y="648" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">表として扱う規約</text>
<text x="1200" y="636" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">S3（メタデータも）</text>
<rect x="656" y="666" width="560" height="56" rx="8" fill="#f2f7f2" stroke="#d9e2ec"/>
<text x="672" y="690" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1f2933" text-anchor="start">AWS Quick Sight</text>
<text x="672" y="710" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">可視化（BI）</text>
<text x="1200" y="698" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="600" fill="#334e68" text-anchor="end">SPICE に取り込む</text>
<text x="656" y="776" font-family="Noto Sans JP,Helvetica,sans-serif" font-size="12.5" font-weight="normal" fill="#52606d" text-anchor="start">Iceberg は形式の規約なので、置き場は S3 のまま変わらない。</text>
</svg>