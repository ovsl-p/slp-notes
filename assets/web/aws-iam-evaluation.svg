<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="Noto Sans JP,Helvetica,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker></defs>
<rect width="900" height="560" fill="#fdfdfb"/>
<text x="40" y="36" font-size="15.5" fill="#111" text-anchor="start">権限の判定 — 拒否が最優先、許可は足し算、書いていないことは拒否</text>
<rect x="40" y="64" width="420" height="300" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="56" y="88" font-size="13" fill="#1f3b52" text-anchor="start">① 1つのリクエストの判定順</text>
<rect x="96" y="104" width="230" height="46" rx="4" fill="#fdf1f1" stroke="#d09a9a" stroke-width="1.2"/>
<text x="211" y="124" font-size="11.5" fill="#5a2626" text-anchor="middle">明示的な拒否（Deny）があるか</text>
<text x="211" y="142" font-size="10.5" fill="#7a5a5a" text-anchor="middle">組織の SCP・バケットポリシー・境界</text>
<rect x="96" y="192" width="230" height="46" rx="4" fill="#eef6ef" stroke="#93b89a" stroke-width="1.2"/>
<text x="211" y="212" font-size="11.5" fill="#24502c" text-anchor="middle">明示的な許可（Allow）があるか</text>
<text x="211" y="230" font-size="10.5" fill="#4a6b4e" text-anchor="middle">アイデンティティ／リソース／境界の内側</text>
<rect x="96" y="280" width="230" height="46" rx="4" fill="#f4f4f4" stroke="#b0b0b0" stroke-width="1.2"/>
<text x="211" y="300" font-size="11.5" fill="#333" text-anchor="middle">どちらも無ければ拒否（暗黙の拒否）</text>
<text x="211" y="318" font-size="10.5" fill="#666" text-anchor="middle">ここが既定値</text>
<line x1="211" y1="150" x2="211" y2="192" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="222" y="175" font-size="10.5" fill="#5b6b7b" text-anchor="start">無ければ</text>
<line x1="211" y1="238" x2="211" y2="280" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="222" y="263" font-size="10.5" fill="#5b6b7b" text-anchor="start">無ければ</text>
<text x="336" y="132" font-size="11" fill="#8a3b3b" text-anchor="start">あれば即・拒否</text>
<text x="336" y="220" font-size="11" fill="#2f6b38" text-anchor="start">あれば許可</text>
<text x="56" y="348" font-size="11" fill="#5a5a5a" text-anchor="start">許可を足しても効かないときは、拒否がどこかで効いている。</text>
<rect x="480" y="64" width="380" height="300" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="496" y="88" font-size="13" fill="#1f3b52" text-anchor="start">② アカウントをまたぐとき</text>
<rect x="500" y="104" width="150" height="86" rx="4" fill="#fbfcfd" stroke="#b8c4cf" stroke-width="1.2"/>
<text x="512" y="126" font-size="12" fill="#333" text-anchor="start">アカウント A</text>
<text x="512" y="148" font-size="11" fill="#555" text-anchor="start">呼び出し元の許可</text>
<text x="512" y="168" font-size="11" fill="#555" text-anchor="start">s3:GetObject</text>
<rect x="690" y="104" width="150" height="86" rx="4" fill="#fdf6ee" stroke="#c9a97a" stroke-width="1.2"/>
<text x="702" y="126" font-size="12" fill="#4a3a22" text-anchor="start">アカウント B</text>
<text x="702" y="148" font-size="11" fill="#5c4a2e" text-anchor="start">バケットポリシー</text>
<text x="702" y="168" font-size="11" fill="#5c4a2e" text-anchor="start">A を Principal に</text>
<rect x="605" y="232" width="120" height="44" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="665" y="259" font-size="11.5" fill="#1f3b52" text-anchor="middle">両方そろえば通る</text>
<line x1="575" y1="190" x2="630" y2="232" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="755" y1="190" x2="700" y2="232" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="496" y="296" font-size="11" fill="#5a5a5a" text-anchor="start">片方だけでは通らない。暗号化されていれば</text>
<text x="496" y="314" font-size="11" fill="#5a5a5a" text-anchor="start">KMS のキーポリシーにも許可が要る。</text>
<text x="496" y="332" font-size="11" fill="#5a5a5a" text-anchor="start">SCP も呼び出し元とリソース側の両方に効く。</text>
<text x="40" y="404" font-size="12" fill="#333" text-anchor="start">許可は足し算、拒否だけが引き算。403 が出たら、まず Deny を探してから許可を足す。</text>
<text x="40" y="430" font-size="12" fill="#333" text-anchor="start">SCP・権限の境界・セッションポリシーは、どれも「許可しない、上限を下げるだけ」で共通している。</text>
</svg>