<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Noto Sans JP,Helvetica,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker></defs>
<rect width="900" height="560" fill="#fdfdfb"/>
<text x="40" y="36" font-size="15.5" fill="#111" text-anchor="start">名前解決の向き — エンドポイントは「AWS に入る／出る」で決まり、問い合わせの向きと一致する</text>
<rect x="40" y="64" width="820" height="176" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="56" y="90" font-size="13" fill="#1f3b52" text-anchor="start">① VPC からオンプレの社内ドメインを引く（アウトバウンドエンドポイント）</text>
<rect x="64" y="104" width="250" height="110" rx="4" fill="#fbfcfd" stroke="#b8c4cf" stroke-width="1.2"/>
<text x="76" y="126" font-size="12.5" fill="#333" text-anchor="start">VPC 10.0.0.0/16</text>
<text x="76" y="152" font-size="11.5" fill="#555" text-anchor="start">Route 53 Resolver</text>
<text x="76" y="176" font-size="11.5" fill="#555" text-anchor="start">CIDR の +2 にいる</text>
<rect x="360" y="132" width="180" height="54" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="450" y="155" font-size="11.5" fill="#1f3b52" text-anchor="middle">アウトバウンド</text>
<text x="450" y="173" font-size="11.5" fill="#1f3b52" text-anchor="middle">エンドポイント</text>
<rect x="596" y="104" width="248" height="110" rx="4" fill="#fdf6ee" stroke="#c9a97a" stroke-width="1.2"/>
<text x="608" y="126" font-size="12.5" fill="#4a3a22" text-anchor="start">オンプレ（社内）</text>
<text x="608" y="152" font-size="11.5" fill="#5c4a2e" text-anchor="start">社内 DNS 10.1.0.53</text>
<text x="608" y="176" font-size="11.5" fill="#5c4a2e" text-anchor="start">corp.example.com</text>
<line x1="314" y1="159" x2="360" y2="159" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="540" y1="159" x2="596" y2="159" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="455" y="205" font-size="11" fill="#5b6b7b" text-anchor="middle">AWS から外へ問い合わせる出口</text>
<rect x="40" y="264" width="820" height="176" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="56" y="290" font-size="13" fill="#1f3b52" text-anchor="start">② オンプレから AWS のプライベート名を引く（インバウンドエンドポイント）</text>
<rect x="64" y="304" width="248" height="110" rx="4" fill="#fdf6ee" stroke="#c9a97a" stroke-width="1.2"/>
<text x="76" y="326" font-size="12.5" fill="#4a3a22" text-anchor="start">オンプレ（社内）</text>
<text x="76" y="352" font-size="11.5" fill="#5c4a2e" text-anchor="start">社内 DNS 10.1.0.53</text>
<text x="76" y="376" font-size="11.5" fill="#5c4a2e" text-anchor="start">db.internal を引きたい</text>
<rect x="360" y="332" width="180" height="54" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="450" y="355" font-size="11.5" fill="#1f3b52" text-anchor="middle">インバウンド</text>
<text x="450" y="373" font-size="11.5" fill="#1f3b52" text-anchor="middle">エンドポイント</text>
<rect x="596" y="304" width="248" height="110" rx="4" fill="#fbfcfd" stroke="#b8c4cf" stroke-width="1.2"/>
<text x="608" y="326" font-size="12.5" fill="#333" text-anchor="start">VPC 10.0.0.0/16</text>
<text x="608" y="352" font-size="11.5" fill="#555" text-anchor="start">Route 53 Resolver</text>
<text x="608" y="376" font-size="11.5" fill="#555" text-anchor="start">db.internal（プライベート）</text>
<line x1="312" y1="359" x2="360" y2="359" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<line x1="540" y1="359" x2="596" y2="359" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="455" y="405" font-size="11" fill="#5b6b7b" text-anchor="middle">外から VPC の中へ入る入口</text>
<text x="40" y="486" font-size="12" fill="#333" text-anchor="start">問い合わせが VPC に入ってくるならインバウンド、出ていくならアウトバウンド。両方向に引くなら両方作る。</text>
<text x="40" y="512" font-size="12" fill="#333" text-anchor="start">プライベートホストゾーンは関連付けた VPC からしか引けない。引けないときは enableDnsSupport と</text>
<text x="40" y="536" font-size="12" fill="#333" text-anchor="start">enableDnsHostnames の両方が true かどうかを先に見る。</text>
</svg>