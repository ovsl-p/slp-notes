<text x="40" y="446" font-size="12" fill="#333" text-anchor="start">SCP が効かない相手: 管理アカウント、サービスリンクロール、組織外からのリソースベースの許可。</text>
<text x="40" y="472" font-size="12" fill="#333" text-anchor="start">組織外からのアクセスは条件キー aws:PrincipalOrgID で弾く。</text>
