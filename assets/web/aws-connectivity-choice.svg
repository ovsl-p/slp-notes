<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Noto Sans JP,Helvetica,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6b7b"/></marker></defs>
<rect width="900" height="560" fill="#fdfdfb"/>
<text x="40" y="36" font-size="15.5" fill="#111" text-anchor="start">つなぎ方の選び方 — 経路を流すか、サービスだけ見せるか</text>
<rect x="40" y="64" width="380" height="406" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="56" y="88" font-size="13" fill="#1f3b52" text-anchor="start">① 順番に絞る</text>
<rect x="64" y="104" width="200" height="48" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="164" y="126" font-size="11.5" fill="#1f3b52" text-anchor="middle">経路を流す必要がある？</text>
<text x="164" y="144" font-size="10.5" fill="#4a6b80" text-anchor="middle">相手の VPC を経路で見せる</text>
<text x="276" y="122" font-size="11" fill="#5b6b7b" text-anchor="start">いいえ</text>
<text x="276" y="140" font-size="11" fill="#5b6b7b" text-anchor="start">→ PrivateLink</text>
<line x1="164" y1="152" x2="164" y2="194" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="174" y="178" font-size="11" fill="#5b6b7b" text-anchor="start">はい</text>
<rect x="64" y="194" width="200" height="48" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="164" y="216" font-size="11.5" fill="#1f3b52" text-anchor="middle">VPC が3つ以上になる？</text>
<text x="164" y="234" font-size="10.5" fill="#4a6b80" text-anchor="middle">集約が要るかどうか</text>
<text x="276" y="212" font-size="11" fill="#5b6b7b" text-anchor="start">いいえ</text>
<text x="276" y="230" font-size="11" fill="#5b6b7b" text-anchor="start">→ ピアリング</text>
<line x1="164" y1="242" x2="164" y2="284" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="174" y="268" font-size="11" fill="#5b6b7b" text-anchor="start">はい</text>
<rect x="64" y="284" width="200" height="48" rx="4" fill="#eef4fa" stroke="#8fb0cc" stroke-width="1.2"/>
<text x="164" y="306" font-size="11.5" fill="#1f3b52" text-anchor="middle">帯域と遅延を保証する？</text>
<text x="164" y="324" font-size="10.5" fill="#4a6b80" text-anchor="middle">専用線が要るか</text>
<text x="276" y="302" font-size="11" fill="#5b6b7b" text-anchor="start">はい</text>
<text x="276" y="320" font-size="11" fill="#5b6b7b" text-anchor="start">→ Direct Connect</text>
<line x1="164" y1="332" x2="164" y2="374" stroke="#5b6b7b" stroke-width="1.4" marker-end="url(#ah)"/>
<text x="174" y="358" font-size="11" fill="#5b6b7b" text-anchor="start">いいえ</text>
<rect x="64" y="374" width="200" height="44" rx="4" fill="#f4f1fa" stroke="#b6a7cf" stroke-width="1.2"/>
<text x="164" y="394" font-size="11.5" fill="#3c2f52" text-anchor="middle">Site-to-Site VPN</text>
<text x="164" y="410" font-size="10" fill="#5a5a72" text-anchor="middle">安いが、帯域と遅延は保証されない</text>
<text x="56" y="446" font-size="11" fill="#5a5a5a" text-anchor="start">どこかで「はい」になったら Transit Gateway に集約する。</text>
<rect x="444" y="64" width="416" height="406" rx="6" fill="#ffffff" stroke="#dbe3ea" stroke-width="1.2"/>
<text x="460" y="88" font-size="13" fill="#1f3b52" text-anchor="start">② 手段ごとの性質</text>
<rect x="460" y="104" width="384" height="30" rx="4" fill="#f4f6f8" stroke="#cfd8df" stroke-width="1.2"/>
<text x="468" y="124" font-size="11" fill="#333" text-anchor="start">手段</text>
<text x="564" y="124" font-size="11" fill="#333" text-anchor="start">推移的</text>
<text x="644" y="124" font-size="11" fill="#333" text-anchor="start">CIDR 重複</text>
<text x="744" y="124" font-size="11" fill="#333" text-anchor="start">帯域保証</text>
<rect x="460" y="134" width="384" height="44" rx="4" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2"/>
<text x="468" y="161" font-size="11.5" fill="#222" text-anchor="start">VPC ピアリング</text>
<text x="564" y="161" font-size="12" fill="#333" text-anchor="middle">✗</text>
<text x="688" y="161" font-size="12" fill="#333" text-anchor="middle">✗</text>
<text x="790" y="161" font-size="12" fill="#333" text-anchor="middle">✗</text>
<rect x="460" y="178" width="384" height="44" rx="4" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2"/>
<text x="468" y="205" font-size="11.5" fill="#222" text-anchor="start">Transit Gateway</text>
<text x="564" y="205" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="688" y="205" font-size="12" fill="#333" text-anchor="middle">✗</text>
<text x="790" y="205" font-size="12" fill="#333" text-anchor="middle">−</text>
<rect x="460" y="222" width="384" height="44" rx="4" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2"/>
<text x="468" y="249" font-size="11.5" fill="#222" text-anchor="start">Site-to-Site VPN</text>
<text x="564" y="249" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="688" y="249" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="790" y="249" font-size="12" fill="#333" text-anchor="middle">✗</text>
<rect x="460" y="266" width="384" height="44" rx="4" fill="#ffffff" stroke="#e2e8ed" stroke-width="1.2"/>
<text x="468" y="293" font-size="11.5" fill="#222" text-anchor="start">Direct Connect</text>
<text x="564" y="293" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="688" y="293" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="790" y="293" font-size="12" fill="#333" text-anchor="middle">○</text>
<text x="460" y="340" font-size="11" fill="#5a5a5a" text-anchor="start">Direct Connect は専用線だが暗号化はされない。</text>
<text x="460" y="362" font-size="11" fill="#5a5a5a" text-anchor="start">PrivateLink は経路ではなくサービスを公開する。</text>
<text x="460" y="384" font-size="11" fill="#5a5a5a" text-anchor="start">CIDR が重複していても使える。VPC Lattice は L7。</text>
<text x="460" y="420" font-size="11.5" fill="#1f3b52" text-anchor="start">「どの手段か」より「経路かサービスか」で先に分ける。</text>
<text x="40" y="500" font-size="12" fill="#333" text-anchor="start">分離はセキュリティグループではなく経路で切る。経路で切れば、なぜ届かないかを説明できる。</text>
<text x="40" y="526" font-size="12" fill="#333" text-anchor="start">ピアリングは1対1で推移的にならない。A-B、B-C とつないでも A から C へは通らない。</text>
</svg>